name: Update live prices

# 평일 매일 06:30 KST (= 21:30 UTC 전일) — 미국 장 마감 후.
# 리포트의 <!--LIVE:START--> ~ <!--LIVE:END--> 블록만 갱신하고,
# 변경이 있을 때만 커밋한다. push되면 Vercel이 자동 배포한다.

on:
  schedule:
    - cron: '30 21 * * 0-4'   # UTC 일~목 21:30 = KST 월~금 06:30
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch prices and patch the live block
        run: python scripts/update_prices.py

      - name: Commit if changed
        run: |
          # ⚠️ 커밋 작성자는 반드시 저장소/Vercel 계정 소유자여야 한다.
          # Vercel이 git 연동 배포에서 커밋 작성자의 팀 권한을 검사하기 때문에,
          # 기본값(github-actions[bot])으로 두면 배포가 'Deployment was blocked'로 실패한다.
          git config user.name  "jinjo202"
          git config user.email "285509946+jinjo202@users.noreply.github.com"
          if git diff --quiet -- big4-semis-q2-2026-review.html index.html; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          git add big4-semis-q2-2026-review.html index.html
          git commit -m "Update live prices ($(TZ=Asia/Seoul date +%Y-%m-%d))"
          git push

      - name: Verify deployment picked it up
        if: success()
        run: |
          sleep 60
          live=$(curl -s "https://big4-review.vercel.app?cb=$(date +%s)" | grep -c 'LIVE:START' || true)
          if [ "$live" -ge 1 ]; then echo "OK: 라이브 블록 확인"; else echo "WARN: 아직 반영 전일 수 있음"; fi
